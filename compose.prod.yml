
services:
  db:
    image: mysql:8.0.29
    platform: linux/amd64
    container_name: mh-api-db
    restart: unless-stopped

    ports:
      - "127.0.0.1:3306:3306"

    environment:
      MYSQL_DATABASE: mh-api
      MYSQL_USER: mh-api
      MYSQL_PASSWORD: ${DB_PASSWORD:?Missing DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Missing DB_ROOT_PASSWORD}

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --max-connections=10
      - --performance-schema=OFF
      - --tmp-table-size=16M
      - --max-heap-table-size=16M

    volumes:
      - mysql-data:/var/lib/mysql

    mem_limit: 512m

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: deploy-api

    container_name: mh-api-server
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./data/monster:/app/data/monster:ro


    environment:
      ENV: prod
      PORT: "8080"
      DATABASE_URL: "mh-api:${DB_PASSWORD}@tcp(db:3306)/mh-api?charset=utf8&parseTime=True&loc=Local"
      ALLOW_URL: "*"

    ports:
      - "127.0.0.1:8080:8080"

    mem_limit: 256m

volumes:
  mysql-data:

